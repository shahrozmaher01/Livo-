name: Build and Upload Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate Generated APK
        id: locate_apk
        run: |
          echo "Scanning workspace for generated debug APK..."
          # Look for the generated debug APK in the standard build outputs directory first
          APK_FILE=$(find app/build/outputs/apk/debug -maxdepth 2 -type f -name "*.apk" 2>/dev/null | head -n 1)
          
          # If not found there, search the entire build directory for any generated debug APK
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*debug*.apk" -not -path "*/.*/*" | head -n 1)
          fi
          
          # Fallback to any APK produced by Gradle
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*.apk" -not -path "*/.*/*" | head -n 1)
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No APK file found in build outputs!"
            exit 1
          fi

          echo "Detected APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Live-APK
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
